<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>날씨</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="날씨">
<meta name="theme-color" content="#2E7FD1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF3FB;
    --sky-2:#D8EAF7;
    --ink:#1B2733;
    --muted:#5C6B7A;
    --accent:#2E7FD1;
    --line:#CDDDEA;
    --warm:#E68A2E;
    --font-display:"Sora",sans-serif;
    --font-body:"Inter",-apple-system,sans-serif;
    --font-mono:"IBM Plex Mono",monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--sky);color:var(--ink);font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:640px;margin:0 auto;padding:18px 16px 60px;}

  .search-row{display:flex;gap:8px;margin-bottom:14px;}
  .search-row input{
    flex:1;background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 16px;
    font-family:var(--font-body);font-size:14.5px;color:var(--ink);outline:none;
  }
  .search-row input:focus{border-color:var(--accent);}
  .search-row button{
    background:var(--accent);color:#fff;border:none;border-radius:999px;padding:0 18px;
    font-weight:700;font-size:13.5px;cursor:pointer;
  }
  .search-msg{font-size:12px;color:var(--warm);margin:-6px 0 10px 6px;min-height:16px;}

  .hero{
    background:linear-gradient(160deg, var(--accent), #5CA6E0);color:#fff;border-radius:18px;
    padding:22px 22px 20px;margin-bottom:14px;position:relative;overflow:hidden;
  }
  .hero .loc{font-family:var(--font-display);font-weight:700;font-size:18px;}
  .hero .sub{font-size:12px;color:#D9ECFB;margin-top:2px;}
  .hero .temp-row{display:flex;align-items:center;gap:14px;margin-top:14px;}
  .hero .emoji{font-size:52px;line-height:1;}
  .hero .temp{font-family:var(--font-mono);font-weight:700;font-size:46px;line-height:1;}
  .hero .desc{font-size:13px;color:#EAF4FC;margin-top:4px;}
  .hero .meta{display:flex;gap:16px;margin-top:14px;font-family:var(--font-mono);font-size:12px;color:#DDEEFB;}

  .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}
  .panel-title{font-family:var(--font-display);font-weight:700;font-size:14.5px;margin:0 0 10px;color:var(--ink);}

  .day-tabs{display:flex;gap:6px;margin-bottom:12px;}
  .day-tab{
    flex:1;background:var(--sky);border:1px solid var(--line);border-radius:10px;padding:8px 4px;
    text-align:center;font-family:var(--font-body);font-weight:600;font-size:12.5px;color:var(--muted);
    cursor:pointer;
  }
  .day-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .hourly-strip{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;}
  .hourly-strip::-webkit-scrollbar{height:4px;}
  .hour-block{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:48px;}
  .hour-block .hr{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);}
  .hour-block .em{font-size:24px;}
  .hour-block .t{font-family:var(--font-mono);font-size:13px;font-weight:600;}

  .daily-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);}
  .daily-row:last-child{border-bottom:none;}
  .daily-row .dlabel{width:52px;flex-shrink:0;}
  .daily-row .dlabel .dow{font-family:var(--font-body);font-weight:700;font-size:13.5px;}
  .daily-row .dlabel .date{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);}
  .daily-row .dem{font-size:22px;width:32px;text-align:center;flex-shrink:0;}
  .daily-row .pop{font-family:var(--font-mono);font-size:11px;color:var(--accent);width:38px;flex-shrink:0;text-align:right;}
  .daily-row .range{flex:1;display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:13px;}
  .daily-row .range .lo{color:var(--muted);width:30px;text-align:right;}
  .daily-row .range .hi{width:30px;}
  .bar-track{flex:1;height:4px;border-radius:3px;background:var(--sky-2);position:relative;}
  .bar-fill{position:absolute;height:100%;border-radius:3px;background:linear-gradient(90deg,#6FB8EE,var(--warm));}

  .empty-note{color:var(--muted);font-size:13px;text-align:center;padding:24px 6px;}
  .loading-note{color:var(--muted);font-size:13px;text-align:center;padding:24px 6px;}
</style>
</head>

function weatherEmoji(code, isDay){
  if(code===0) return isDay ? "☀️" : "🌙";
  if(code===1) return isDay ? "🌤️" : "🌙";
  if(code===2) return "⛅";
  if(code===3) return "☁️";
  if(code===45||code===48) return "🌫️";
  if(code===51||code===53||code===55) return "🌦️";
  if(code===56||code===57) return "🌧️";
  if(code===61||code===63||code===65) return "🌧️";
  if(code===66||code===67) return "🌧️";
  if(code===71||code===73||code===75||code===77) return "❄️";
  if(code===80||code===81||code===82) return "🌦️";
  if(code===85||code===86) return "🌨️";
  if(code===95||code===96||code===99) return "⛈️";
  return "🌡️";
}
function weatherDesc(code){
  const map = {0:"맑음",1:"대체로 맑음",2:"구름 조금",3:"흐림",45:"안개",48:"짙은 안개",
    51:"약한 이슬비",53:"이슬비",55:"강한 이슬비",56:"약한 진눈깨비",57:"진눈깨비",
    61:"약한 비",63:"비",65:"강한 비",66:"약한 얼음비",67:"얼음비",
    71:"약한 눈",73:"눈",75:"강한 눈",77:"싸락눈",80:"약한 소나기",81:"소나기",82:"강한 소나기",
    85:"약한 소낙눈",86:"소낙눈",95:"뇌우",96:"뇌우(약한 우박)",99:"뇌우(강한 우박)"};
  return map[code] || "-";
}
function fmtHour(iso){
  const h = new Date(iso).getHours();
  return h===0 ? "0시" : h+"시";
}
function dowLabel(iso, idx){
  if(idx===0) return "오늘";
  if(idx===1) return "내일";
  const d = new Date(iso+"T00:00:00");
  return "일월화수목금토"[d.getDay()]+"요일";
}
function dateLabel(iso){
  const d = new Date(iso+"T00:00:00");
  return (d.getMonth()+1)+"/"+d.getDate();
}

function findKoreaCity(query){
  const q = query.trim().replace(/(특별시|광역시|특별자치시|특별자치도|도|시|군)$/,"");
  if(KOREA_CITIES[q]) return KOREA_CITIES[q];
  if(KOREA_CITIES[query.trim()]) return KOREA_CITIES[query.trim()];
  const keys = Object.keys(KOREA_CITIES);
  const partial = keys.find(k=> k.startsWith(q) || q.startsWith(k));
  return partial ? KOREA_CITIES[partial] : null;
}

async function fetchWeather(loc){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&hourly=temperature_2m,weathercode,is_day&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&current_weather=true&timezone=auto&forecast_days=10`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("날씨 정보를 가져오지 못했어요.");
  return await res.json();
}

async function geocode(query){
  const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=ko&format=json`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("지역 검색에 실패했어요.");
  const data = await res.json();
  return data.results || [];
}

async function loadAndRender(loc){
  document.getElementById("view").innerHTML = `<div class="loading-note">날씨 정보를 불러오는 중…</div>`;
  try{
    const data = await fetchWeather(loc);
    hourly = data.hourly;
    daily = data.daily;
    currentWeather = data.current_weather;
    currentLoc = loc;
    selectedDayIdx = 0;
    render();
  }catch(e){
    document.getElementById("view").innerHTML = `<div class="empty-note">날씨 정보를 불러오지 못했어요.<br>네트워크 연결을 확인하고 다시 시도해주세요.</div>`;
  }
}

function render(){
  const view = document.getElementById("view");
  view.innerHTML = heroHtml() + hourlyPanelHtml() + dailyPanelHtml();
  bindDayTabs();
}

function heroHtml(){
  const isDay = currentWeather ? currentWeather.is_day===1 : true;
  const code = currentWeather ? currentWeather.weathercode : 0;
  const temp = currentWeather ? Math.round(currentWeather.temperature) : "-";
  const todayMax = daily ? Math.round(daily.temperature_2m_max[0]) : "-";
  const todayMin = daily ? Math.round(daily.temperature_2m_min[0]) : "-";
  const pop = daily ? daily.precipitation_probability_max[0] : null;
  return `
    <div class="hero">
      <div class="loc">${escapeHtml(currentLoc.name)}</div>
      <div class="sub">${escapeHtml(currentLoc.admin||"")}</div>
      <div class="temp-row">
        <div class="emoji">${weatherEmoji(code, isDay)}</div>
        <div>
          <div class="temp">${temp}°</div>
          <div class="desc">${weatherDesc(code)}</div>
        </div>
      </div>
      <div class="meta">
        <span>최고 ${todayMax}° · 최저 ${todayMin}°</span>
        ${pop!==null ? `<span>강수 ${pop}%</span>` : ""}
      </div>
    </div>
  `;
}

function hourlyPanelHtml(){
  if(!hourly) return "";
  const dayTabs = [0,1,2].map(i=>{
    const label = i===0?"오늘":(i===1?"내일":"모레");
    return `<div class="day-tab ${i===selectedDayIdx?"active":""}" data-day="${i}">${label}</div>`;
  }).join("");

  const targetDate = daily.time[selectedDayIdx];
  const blocks = [];
  for(let h=0; h<hourly.time.length; h++){
    if(!hourly.time[h].startsWith(targetDate)) continue;
    const hourNum = new Date(hourly.time[h]).getHours();
    if(hourNum % 3 !== 0) continue;
    blocks.push(`
      <div class="hour-block">
        <div class="hr">${fmtHour(hourly.time[h])}</div>
        <div class="em">${weatherEmoji(hourly.weathercode[h], hourly.is_day[h]===1)}</div>
        <div class="t">${Math.round(hourly.temperature_2m[h])}°</div>
      </div>
    `);
  }
  return `
    <div class="panel">
      <div class="day-tabs">${dayTabs}</div>
      <div class="hourly-strip">${blocks.join("") || `<div class="empty-note">시간별 정보가 없어요.</div>`}</div>
    </div>
  `;
}

function dailyPanelHtml(){
  if(!daily) return "";
  const allMax = Math.max(...daily.temperature_2m_max);
  const allMin = Math.min(...daily.temperature_2m_min);
  const span = Math.max(1, allMax - allMin);
  const rows = daily.time.map((iso, i)=>{
    const lo = Math.round(daily.temperature_2m_min[i]);
    const hi = Math.round(daily.temperature_2m_max[i]);
    const pop = daily.precipitation_probability_max[i];
    const leftPct = ((lo - allMin)/span)*100;
    const widthPct = ((hi - lo)/span)*100;
    return `
      <div class="daily-row">
        <div class="dlabel">
          <div class="dow">${dowLabel(iso, i)}</div>
          <div class="date">${dateLabel(iso)}</div>
        </div>
        <div class="dem">${weatherEmoji(daily.weathercode[i], true)}</div>
        <div class="pop">${pop!==null && pop!==undefined ? pop+"%" : ""}</div>
        <div class="range">
          <span class="lo">${lo}°</span>
          <div class="bar-track"><div class="bar-fill" style="left:${leftPct}%;width:${widthPct}%;"></div></div>
          <span class="hi">${hi}°</span>
        </div>
      </div>
    `;
  }).join("");
  return `
    <div class="panel">
      <div class="panel-title">10일간의 날씨</div>
      ${rows}
    </div>
  `;
}

function bindDayTabs(){
  document.querySelectorAll("[data-day]").forEach(tab=>{
    tab.addEventListener("click", ()=>{
      selectedDayIdx = Number(tab.dataset.day);
      render();
    });
  });
}

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function doSearch(){
  const input = document.getElementById("searchInput");
  const msg = document.getElementById("searchMsg");
  const q = input.value.trim();
  if(!q) return;
  msg.textContent = "검색 중…";

  const local = findKoreaCity(q);
  if(local){
    msg.textContent = "";
    input.value = "";
    await loadAndRender({ name:local.name, admin:local.admin, lat:local.lat, lon:local.lon });
    return;
  }

  try{
    const results = await geocode(q);
    if(results.length===0){
      msg.textContent = "해당 지역을 찾을 수 없어요. 다른 이름으로 검색해보세요.";
      return;
    }
    const r = results[0];
    const admin = [r.admin1, r.country].filter(Boolean).join(", ");
    msg.textContent = "";
    input.value = "";
    await loadAndRender({ name:r.name, admin, lat:r.latitude, lon:r.longitude });
  }catch(e){
    msg.textContent = "검색에 실패했어요. 네트워크를 확인해주세요.";
  }
}

function init(){
  document.getElementById("searchBtn").addEventListener("click", doSearch);
  document.getElementById("searchInput").addEventListener("keydown", e=>{ if(e.key==="Enter") doSearch(); });
  loadAndRender(currentLoc);
}

init();
</script>
