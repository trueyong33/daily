<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 운세 &amp; 바이오리듬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#12141f;
    --panel:#1c1f2e;
    --panel-2:#242840;
    --paper:#f4ecd8;
    --paper-2:#ece0c4;
    --ink:#2b2620;
    --gold:#d4af6a;
    --gold-soft:#e8cf9c;
    --wood:#6fa287;
    --fire:#c64b3c;
    --water:#4a7fb5;
    --earth:#c9a24b;
    --cream:#ede6d6;
    --muted:#9a97ad;
    --font-display:'Song Myung', 'Noto Sans KR', serif;
    --font-body:'Noto Sans KR', system-ui, -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1.5px 1.5px at 10% 15%, rgba(237,230,214,.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 80% 8%, rgba(237,230,214,.4) 50%, transparent 51%),
      radial-gradient(1px 1px at 60% 30%, rgba(237,230,214,.35) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 30% 60%, rgba(237,230,214,.3) 50%, transparent 51%),
      radial-gradient(1px 1px at 90% 70%, rgba(237,230,214,.4) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 20% 85%, rgba(237,230,214,.3) 50%, transparent 51%),
      radial-gradient(ellipse at 50% -10%, #232744 0%, var(--void) 55%);
    background-color:var(--void);
    color:var(--cream);
    font-family:var(--font-body);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
  }
  .app{width:100%;max-width:480px;}
  .app-header{text-align:center;margin-bottom:28px;}
  .app-header h1{
    font-family:var(--font-display);
    font-weight:400;
    font-size:2rem;
    margin:0;
    color:var(--gold-soft);
    letter-spacing:.02em;
  }
  .app-header .sub{
    margin:4px 0 0;
    font-size:.8rem;
    letter-spacing:.35em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .screen{display:none;}
  .screen.active{display:block;animation:fadeIn .5s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  /* ---- input screen ---- */
  .fortune-form{
    background:var(--panel);
    border:1px solid rgba(212,175,106,.25);
    border-radius:18px;
    padding:28px 24px 32px;
    display:flex;
    flex-direction:column;
    gap:18px;
    box-shadow:0 20px 40px rgba(0,0,0,.35);
  }
  .fortune-form label{
    display:flex;
    flex-direction:column;
    gap:8px;
    font-size:.9rem;
    color:var(--cream);
  }
  .fortune-form .optional{color:var(--muted);font-size:.75rem;font-weight:400;}
  .fortune-form input{
    background:var(--void);
    border:1px solid rgba(154,151,173,.35);
    border-radius:10px;
    padding:12px 14px;
    color:var(--cream);
    font-family:var(--font-mono);
    font-size:.95rem;
  }
  .fortune-form input:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:1px;
    border-color:var(--gold);
  }
  .fortune-form input::-webkit-calendar-picker-indicator{filter:invert(.8);}
  .fortune-form select{
    background:var(--void);
    border:1px solid rgba(154,151,173,.35);
    border-radius:10px;
    padding:12px 10px;
    color:var(--cream);
    font-family:var(--font-mono);
    font-size:.9rem;
  }
  .fortune-form select:focus-visible{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
  .field-label{font-size:.9rem;color:var(--cream);}
  .cal-type-group{display:flex;flex-direction:column;gap:8px;}
  .cal-toggle{display:flex;gap:8px;}
  .cal-toggle-btn{
    flex:1;
    background:var(--void);
    border:1px solid rgba(154,151,173,.35);
    color:var(--muted);
    border-radius:10px;
    padding:9px 0;
    font-family:var(--font-body);
    font-size:.85rem;
    cursor:pointer;
  }
  .cal-toggle-btn.active{
    background:rgba(212,175,106,.15);
    border-color:var(--gold);
    color:var(--gold-soft);
    font-weight:700;
  }
  .cal-toggle-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .cal-block{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
  .lunar-selects{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;}
  .leap-check{
    display:flex;align-items:center;gap:8px;
    font-size:.82rem;color:var(--muted);
    cursor:pointer;
  }
  .leap-check input{width:16px;height:16px;accent-color:var(--gold);}
  .leap-info{font-size:.75rem;color:var(--muted);margin:0;}
  .field-error{
    font-size:.78rem;color:var(--fire);margin:0;
    background:rgba(198,75,60,.12);
    border-radius:8px;padding:8px 10px;
  }
  .lunar-note{font-size:.72rem;color:var(--muted);margin:2px 0 0;}
  .btn-primary{
    margin-top:8px;
    background:linear-gradient(135deg, var(--gold) 0%, #b98d4a 100%);
    color:#1c1508;
    border:none;
    border-radius:10px;
    padding:14px;
    font-family:var(--font-body);
    font-weight:700;
    font-size:1rem;
    letter-spacing:.02em;
    cursor:pointer;
  }
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:focus-visible{outline:2px solid var(--cream);outline-offset:2px;}
  .btn-ghost{
    background:transparent;
    border:1px solid rgba(154,151,173,.4);
    color:var(--muted);
    border-radius:10px;
    padding:10px 16px;
    font-family:var(--font-body);
    font-size:.85rem;
    cursor:pointer;
    width:100%;
    margin-top:24px;
  }
  .btn-ghost:hover{color:var(--cream);border-color:var(--cream);}
  .hint{font-size:.78rem;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6;}
  .pin-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:-4px;}
  .pin-check{
    display:flex;align-items:center;gap:8px;
    font-size:.85rem;color:var(--cream);
    cursor:pointer;
  }
  .pin-check input{width:16px;height:16px;accent-color:var(--gold);flex:0 0 auto;}
  .unpin-btn{
    background:transparent;border:1px solid rgba(198,75,60,.5);
    color:var(--fire);
    border-radius:8px;padding:6px 10px;
    font-size:.72rem;cursor:pointer;
    flex:0 0 auto;
  }
  .unpin-btn:hover{background:rgba(198,75,60,.12);}

  /* ---- zodiac badge ---- */
  .zodiac-badge{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    margin-bottom:18px;
  }
  .zodiac-emoji{
    width:84px;height:84px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--panel-2), var(--panel));
    border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-size:42px;
    box-shadow:0 8px 20px rgba(0,0,0,.4), inset 0 0 14px rgba(212,175,106,.15);
  }
  .zodiac-label{
    font-family:var(--font-display);
    font-size:1.1rem;
    color:var(--gold-soft);
  }

  /* ---- dial ---- */
  .dial-wrap{display:flex;justify-content:center;margin-bottom:22px;}
  .dial-wrap svg{width:220px;height:220px;}
  .dial-sector{transition:opacity .3s;}
  .dial-emoji{font-size:15px;text-anchor:middle;dominant-baseline:middle;}
  .dial-center-days{
    font-family:var(--font-mono);
    font-size:20px;
    fill:var(--gold-soft);
    text-anchor:middle;
  }
  .dial-center-label{
    font-family:var(--font-body);
    font-size:10px;
    fill:var(--muted);
    text-anchor:middle;
    letter-spacing:.05em;
  }
  .dial-element-tag{
    display:flex;justify-content:center;align-items:center;gap:8px;
    font-size:.85rem;color:var(--muted);margin-bottom:24px;
  }
  .dial-element-swatch{width:10px;height:10px;border-radius:50%;display:inline-block;}

  /* ---- fortune card ---- */
  .fortune-card{
    background:var(--paper);
    color:var(--ink);
    border-radius:14px;
    padding:26px 22px 22px;
    position:relative;
    box-shadow:0 18px 36px rgba(0,0,0,.4);
    border-top:3px dashed rgba(43,38,32,.25);
    margin-bottom:22px;
  }
  .seal{
    position:absolute;
    top:-16px;right:20px;
    width:44px;height:44px;
    border-radius:50%;
    background:var(--fire);
    color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);
    font-size:1.3rem;
    transform:rotate(-8deg);
    box-shadow:0 4px 10px rgba(0,0,0,.35);
    border:2px solid rgba(244,236,216,.5);
  }
  .fortune-card .greeting{
    font-family:var(--font-display);
    font-size:1.15rem;
    margin:0 0 4px;
  }
  .fortune-card .greeting .name{color:var(--fire);}
  .fortune-card .date-line{
    font-family:var(--font-mono);
    font-size:.75rem;
    color:rgba(43,38,32,.55);
    margin:0 0 16px;
  }
  .total-stars{font-size:1rem;letter-spacing:2px;color:var(--gold);margin-bottom:8px;}
  .total-text{font-size:.95rem;line-height:1.65;margin:0 0 20px;}
  .sub-list{display:flex;flex-direction:column;gap:12px;margin-bottom:18px;}
  .sub-row{display:flex;align-items:flex-start;gap:10px;}
  .sub-row .sub-label{
    flex:0 0 64px;
    font-size:.78rem;
    font-weight:700;
    color:rgba(43,38,32,.7);
    padding-top:1px;
  }
  .sub-row .sub-body{flex:1;}
  .sub-row .sub-stars{font-size:.72rem;letter-spacing:1px;color:var(--earth);display:block;margin-bottom:2px;}
  .sub-row .sub-text{font-size:.85rem;line-height:1.5;margin:0;}
  .lucky-row{
    display:flex;gap:8px;flex-wrap:wrap;
    border-top:1px solid rgba(43,38,32,.15);
    padding-top:16px;
  }
  .lucky-chip{
    background:rgba(43,38,32,.06);
    border-radius:999px;
    padding:6px 12px;
    font-size:.75rem;
    display:flex;align-items:center;gap:6px;
  }
  .lucky-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

  /* ---- biorhythm ---- */
  .bio-section{
    background:var(--panel);
    border:1px solid rgba(212,175,106,.2);
    border-radius:14px;
    padding:20px 18px 16px;
    margin-bottom:18px;
  }
  .bio-title{
    font-family:var(--font-display);
    font-size:1.05rem;
    color:var(--gold-soft);
    margin:0 0 2px;
  }
  .bio-sub{font-size:.72rem;color:var(--muted);margin:0 0 18px;}
  .bio-gauges{display:flex;flex-direction:column;gap:18px;}
  .bio-gauge-row{}
  .bio-gauge-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .bio-gauge-label{font-size:.85rem;font-weight:700;color:var(--cream);}
  .bio-gauge-value{font-family:var(--font-mono);font-size:.95rem;}
  .bio-gauge-track{position:relative;height:10px;background:rgba(237,230,214,.08);border-radius:6px;overflow:hidden;}
  .bio-gauge-mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(237,230,214,.35);}
  .bio-gauge-fill{position:absolute;top:0;bottom:0;border-radius:6px;transition:width .8s ease, left .8s ease;}
  .bio-gauge-status{font-size:.76rem;color:var(--muted);margin:6px 0 0;}
  .bio-note{font-size:.7rem;color:var(--muted);text-align:center;margin-top:16px;line-height:1.6;}

  .disclaimer{
    text-align:center;font-size:.7rem;color:var(--muted);line-height:1.7;margin-top:8px;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>오늘의 운세</h1>
    <p class="sub">Daily Fortune &amp; Biorhythm</p>
  </header>

  <section id="screen-input" class="screen active">
    <form id="fortune-form" class="fortune-form">
      <label>이름 <span class="optional">(선택, 인사말에 사용돼요)</span>
        <input type="text" id="name" maxlength="10" placeholder="예: 지은">
      </label>
      <div class="cal-type-group">
        <span class="field-label">생년월일</span>
        <div class="cal-toggle" role="group" aria-label="달력 종류 선택">
          <button type="button" class="cal-toggle-btn active" id="btn-cal-solar" aria-pressed="true">양력</button>
          <button type="button" class="cal-toggle-btn" id="btn-cal-lunar" aria-pressed="false">음력</button>
        </div>
      </div>

      <div id="solar-block" class="cal-block">
        <input type="date" id="birthdate" min="1900-01-01" max="2100-12-31">
      </div>

      <div id="lunar-block" class="cal-block" hidden>
        <div class="lunar-selects">
          <select id="lunar-year" aria-label="음력 연도"></select>
          <select id="lunar-month" aria-label="음력 월"></select>
          <select id="lunar-day" aria-label="음력 일"></select>
        </div>
        <label class="leap-check">
          <input type="checkbox" id="lunar-leap">
          윤달이에요
        </label>
        <p class="leap-info" id="leap-info"></p>
      </div>

      <p class="field-error" id="birth-error" hidden></p>

      <label>태어난 시간 <span class="optional">(선택)</span>
        <input type="time" id="birthtime">
      </label>

      <div class="pin-row">
        <label class="pin-check">
          <input type="checkbox" id="pin-checkbox">
          내 정보로 고정하기 <span class="optional">(다음에 자동으로 불러와요)</span>
        </label>
        <button type="button" id="unpin-btn" class="unpin-btn" hidden>고정 해제</button>
      </div>

      <button type="submit" class="btn-primary">오늘의 운세 보기</button>
    </form>
    <p class="hint" id="form-hint">체크박스를 해제하면 다른 사람의 운세도 확인할 수 있어요. 고정하지 않은 정보는 저장되지 않아요.</p>
  </section>

  <section id="screen-result" class="screen">
    <div class="zodiac-badge">
      <div class="zodiac-emoji" id="zodiac-emoji"></div>
      <div class="zodiac-label" id="zodiac-label"></div>
    </div>

    <div class="dial-wrap"><svg id="dial" viewBox="0 0 220 220"></svg></div>
    <div class="dial-element-tag">
      <span class="dial-element-swatch" id="element-swatch"></span>
      <span id="element-text"></span>
    </div>

    <div class="fortune-card">
      <div class="seal">運</div>
      <p class="greeting"><span class="name" id="greeting-name"></span>님, 오늘의 운세예요</p>
      <p class="date-line" id="date-line"></p>
      <p class="lunar-note" id="lunar-note" hidden></p>
      <div class="total-stars" id="total-stars"></div>
      <p class="total-text" id="total-text"></p>

      <div class="sub-list" id="sub-list"></div>

      <div class="lucky-row" id="lucky-row"></div>
    </div>

    <div class="bio-section">
      <h2 class="bio-title">바이오리듬</h2>
      <p class="bio-sub">오늘 신체·감성·지성 리듬이 어떤 흐름인지 보여드려요</p>
      <div class="bio-gauges" id="bio-gauges"></div>
      <p class="bio-note">태어난 지 <span id="days-alive-inline"></span>일째 되는 날, 오늘 기준 리듬이에요</p>
    </div>

    <p class="disclaimer">본 콘텐츠는 재미로 즐기는 엔터테인먼트이며, 실제 명리학적·과학적 근거와는 무관해요.</p>
    <button class="btn-ghost" id="back-btn">다른 생년월일로 다시 보기</button>
  </section>
</div>

<script>
(function(){
  "use strict";

  /* ---------- lunar <-> solar conversion (1900-2100) ----------
     Table encodes, per lunar year, which of its 12 (or 13) months
     have 30 vs 29 days and which month (if any) is the leap month.
     This is the standard East-Asian lunisolar calendar table used
     by widely-adopted open-source calendar libraries. */
  const lunarInfo = [
    0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
    0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
    0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
    0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
    0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
    0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,
    0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
    0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
    0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
    0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x05ac0,0x0ab60,0x096d5,0x092e0,
    0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
    0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
    0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
    0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
    0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,
    0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,
    0x092e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,
    0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,
    0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,
    0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a4d0,0x0d150,0x0f252,
    0x0d520
  ]; // index 0 => year 1900 ... index 200 => year 2100

  function lunarLeapMonth(y){ return lunarInfo[y-1900] & 0xf; }
  function lunarLeapDays(y){ return lunarLeapMonth(y) ? ((lunarInfo[y-1900] & 0x10000) ? 30 : 29) : 0; }
  function lunarMonthDays(y,m){ return (lunarInfo[y-1900] & (0x10000 >> m)) ? 30 : 29; }
  function lunarYearDays(y){
    let sum = 348;
    const info = lunarInfo[y-1900];
    for(let bit=0x8000; bit>0x8; bit>>=1){ sum += (info & bit) ? 1 : 0; }
    return sum + lunarLeapDays(y);
  }
  /**
   * Convert a lunar date to its solar (Gregorian) equivalent.
   * Returns {y,m,d} or null if the date is invalid / out of range.
   */
  function lunarToSolar(y, m, d, isLeap){
    y = Number(y); m = Number(m); d = Number(d); isLeap = Boolean(isLeap);
    if(!Number.isInteger(y) || !Number.isInteger(m) || !Number.isInteger(d)) return null;
    if(y < 1900 || y > 2100 || m < 1 || m > 12) return null;
    const leapMonthOfYear = lunarLeapMonth(y);
    if(isLeap && leapMonthOfYear !== m) return null;
    const maxDay = isLeap ? lunarLeapDays(y) : lunarMonthDays(y,m);
    if(d < 1 || d > maxDay) return null;

    let offset = 0;
    for(let i=1900;i<y;i++){ offset += lunarYearDays(i); }
    let isAdd = false;
    for(let i=1;i<m;i++){
      if(!isAdd && leapMonthOfYear <= i && leapMonthOfYear > 0){
        offset += lunarLeapDays(y);
        isAdd = true;
      }
      offset += lunarMonthDays(y,i);
    }
    if(isLeap){ offset += lunarMonthDays(y,m); }

    const base = Date.UTC(1900,1,30,0,0,0); // lunar 1900-01-01 == solar 1900-01-30
    const solarDate = new Date((offset + d - 31) * 86400000 + base);
    return { y: solarDate.getUTCFullYear(), m: solarDate.getUTCMonth()+1, d: solarDate.getUTCDate() };
  }

  function arcPath(cx,cy,rOuter,rInner,startAngle,endAngle){
    const p1 = polar(cx,cy,rOuter,endAngle);
    const p2 = polar(cx,cy,rOuter,startAngle);
    const p3 = polar(cx,cy,rInner,startAngle);
    const p4 = polar(cx,cy,rInner,endAngle);
    const large = (endAngle-startAngle) <= 180 ? 0 : 1;
    return [
      "M", p1.x, p1.y,
      "A", rOuter, rOuter, 0, large, 0, p2.x, p2.y,
      "L", p3.x, p3.y,
      "A", rInner, rInner, 0, large, 1, p4.x, p4.y,
      "Z"
    ].join(" ");
  }

  unpinBtn.addEventListener("click", async function(){
    await deletePinnedData();
    pinCheckbox.checked = false;
    unpinBtn.hidden = true;
    document.getElementById("name").value = "";
    document.getElementById("birthdate").value = "";
    document.getElementById("birthtime").value = "";
  });
  (async function initFromPinnedData(){
    const data = await loadPinnedData();
    if(data){
      applyPinnedDataToForm(data);
      pinCheckbox.checked = true;
      unpinBtn.hidden = false;
      if(form.requestSubmit) form.requestSubmit();
      else form.dispatchEvent(new Event("submit", {cancelable:true}));
    }
  })();

  form.addEventListener("submit", function(e){
    e.preventDefault();
    const name = document.getElementById("name").value.trim() || "그대";
    const birthtimeStr = document.getElementById("birthtime").value;

    let by, bm, bd, lunarOriginText = null;

    if(calType === "solar"){
      const solarVal = document.getElementById("birthdate").value;
      if(!solarVal){
        birthError.textContent = "생년월일을 입력해주세요.";
        birthError.hidden = false;
        return;
      }
      [by,bm,bd] = solarVal.split("-").map(Number);
      birthError.hidden = true;
    } else {
      const ly = Number(lunarYearSel.value);
      const lm = Number(lunarMonthSel.value);
      const ld = Number(lunarDaySel.value);
      const isLeap = lunarLeapChk.checked;
      const converted = lunarToSolar(ly, lm, ld, isLeap);
      if(!converted){
        birthError.textContent = "입력한 음력 날짜를 확인해주세요. 윤달 여부나 일자가 맞지 않을 수 있어요.";
        birthError.hidden = false;
        return;
      }
      by = converted.y; bm = converted.m; bd = converted.d;
      birthError.hidden = true;
      lunarOriginText = "음력 "+ly+"."+String(lm).padStart(2,"0")+"."+String(ld).padStart(2,"0")+(isLeap?"(윤달)":"") +
        " → 양력 "+by+"."+String(bm).padStart(2,"0")+"."+String(bd).padStart(2,"0")+"로 계산했어요";
    }

    const birthdateStr = by+"-"+String(bm).padStart(2,"0")+"-"+String(bd).padStart(2,"0");
    const birthDayNum = utcDayNumber(by, bm-1, bd);

    if(pinCheckbox.checked){
      savePinnedData(collectFormDataForPin());
      unpinBtn.hidden = false;
    }

    const now = new Date();
    const todayDayNum = utcDayNumber(now.getFullYear(), now.getMonth(), now.getDate());
    const daysAlive = todayDayNum - birthDayNum;

    const todayStr = now.getFullYear()+"-"+(now.getMonth()+1)+"-"+now.getDate();
    const seedStr = birthdateStr + "|" + birthtimeStr + "|" + name + "|" + todayStr;
    const rng = mulberry32(hashString(seedStr));

    // total fortune
    const totalScore = pickScore(rng);
    const totalText = pick(rng, totalPool[totalScore]);

    // sub fortunes
    const subKeys = ["love","money","health","social"];
    const subResults = subKeys.map(function(k){
      const score = pickScore(rng);
      return {key:k, score:score, text: pick(rng, subPools[k][score])};
    });

    // lucky picks
    const luckyColor = pick(rng, luckyColors);
    const luckyNumber = Math.floor(rng()*9)+1;
    const luckyDirection = pick(rng, luckyDirections);

    // day-based (shared) flavor
    const element = elements[((todayDayNum % 5)+5)%5];
    const animalIdx = ((todayDayNum % 12)+12)%12;

    // birth-year zodiac sign (띠) — based on lunar year, not solar year
    const lunarYearForZodiac = getLunarYearForSolarDate(by, bm, bd);
    const zodiacIdx = getZodiacIndex(lunarYearForZodiac);

    // ---- fill DOM ----
    document.getElementById("zodiac-emoji").textContent = animals[zodiacIdx];
    document.getElementById("zodiac-label").textContent = animalNames[zodiacIdx] + "띠";
    document.getElementById("greeting-name").textContent = name;
    document.getElementById("date-line").textContent =
      now.getFullYear()+"."+String(now.getMonth()+1).padStart(2,"0")+"."+String(now.getDate()).padStart(2,"0")+" 기준";
    const lunarNoteEl = document.getElementById("lunar-note");
    if(lunarOriginText){
      lunarNoteEl.textContent = lunarOriginText;
      lunarNoteEl.hidden = false;
    } else {
      lunarNoteEl.hidden = true;
    }
    document.getElementById("total-stars").textContent = stars(totalScore);
    document.getElementById("total-text").textContent = totalText;

    const subListEl = document.getElementById("sub-list");
    subListEl.innerHTML = "";
    subResults.forEach(function(s){
      const row = document.createElement("div");
      row.className = "sub-row";
      row.innerHTML =
        '<div class="sub-label">'+subLabels[s.key]+'</div>'+
        '<div class="sub-body">'+
          '<span class="sub-stars">'+stars(s.score)+'</span>'+
          '<p class="sub-text">'+s.text+'</p>'+
        '</div>';
      subListEl.appendChild(row);
    });

    const luckyRowEl = document.getElementById("lucky-row");
    luckyRowEl.innerHTML =
      '<div class="lucky-chip"><span class="lucky-dot" style="background:'+luckyColor.hex+'"></span>행운의 색 · '+luckyColor.name+'</div>'+
      '<div class="lucky-chip">🔢 행운의 숫자 · '+luckyNumber+'</div>'+
      '<div class="lucky-chip">🧭 행운의 방향 · '+luckyDirection+'</div>';

    document.getElementById("element-swatch").style.background = element.color;
    document.getElementById("element-text").textContent = "오늘은 "+element.name+"의 기운, "+element.desc;

    renderDial(document.getElementById("dial"), animalIdx, daysAlive, element.color);

    renderBioGauges(document.getElementById("bio-gauges"), birthDayNum, todayDayNum);
    document.getElementById("days-alive-inline").textContent = daysAlive.toLocaleString();

    screenInput.classList.remove("active");
    screenResult.classList.add("active");
    window.scrollTo({top:0, behavior:"smooth"});
  });

  document.getElementById("back-btn").addEventListener("click", function(){
    screenResult.classList.remove("active");
    screenInput.classList.add("active");
  });

})();
</script>
</body>
</html>
